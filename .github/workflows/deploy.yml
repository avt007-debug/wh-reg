# Deploys the backend to your Supabase project after CI passes on main.
#
# Repository → Settings → Secrets and variables → Actions:
#   secrets.SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   secrets.SUPABASE_DB_PASSWORD    database password of the project
#   vars.SUPABASE_PROJECT_ID        project ref, e.g. abcdefghijklmnopqrst
# Optional: create a GitHub Environment named "production" with required reviewers
# so every deploy waits for your approval.
name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      push_config:
        description: 'Also push supabase/config.toml settings (auth, storage) to the project'
        type: boolean
        default: false

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_YES: 'true'                       # hosted changes need explicit consent in CI
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_ID"
      - name: Show pending migrations
        run: supabase migration list --remote
      - name: Apply database migrations (never runs seed.sql)
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        run: supabase functions deploy --use-api
      - name: Push config.toml (auth / storage settings)
        if: ${{ inputs.push_config }}
        run: supabase config push --yes
