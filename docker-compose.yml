# Local development stack: Postgres 16 + MinIO (S3-compatible) + API + worker.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: migrator
      POSTGRES_DB: whreg
      TZ: Asia/Kolkata
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d whreg"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://app_api:app_api_dev_password@db:5432/whreg
      S3_ENDPOINT: http://minio:9000
    command: ["node", "dist/server.js"]
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://app_api:app_api_dev_password@db:5432/whreg
    command: ["node", "dist/jobs/worker.js"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata: {}
  minio: {}
